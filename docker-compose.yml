version: '3.8'

services:

  db:

    image: postgres:16

    container_name: postgres-container

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - django-network



  python-app:

    build: .

    container_name: django-app-container

    restart: always

    ports:
      - "8000:8000"

    working_dir: /app

    volumes:
      - .:/app
      - media_data:/app/media

    env_file:
      - .env

    depends_on:
      - db

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    networks:
      - django-network



volumes:
  postgres_data:
  media_data:



networks:
  django-network: