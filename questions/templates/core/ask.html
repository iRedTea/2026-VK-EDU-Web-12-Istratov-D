{% extends 'core/layout/base.html' %}
{% load static %}

{% block content %}

<div class="main-title">
    <h1>Ask a Question</h1>
</div>

<form class="form">
    <div class="form-row">
        <label for="title">Title</label>
        <input id="title" type="text" value="How to build a moon park ?">
    </div>
    <div class="form-row">
        <label for="text">Text</label>
        <textarea id="text">Really, how ? Have no idea about it</textarea>
    </div>
    <div class="form-row">
        <label for="tags">Tags</label>
        <input id="tags" type="text" value="moon, park, puzzle">
    </div>
    <div>
        <button class="button" type="button">ASK IT</button>
    </div>
</form>
{% endblock %}
