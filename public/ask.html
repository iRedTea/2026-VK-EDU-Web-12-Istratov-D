<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VkDesk | Ask a Question</title>
    <meta name="description" content="VkDesk Q&A">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">VkDesk</div>
        <form class="search">
            <input type="text" placeholder="Search">
            <a class="button button--ask" href="index.html">ASK IT</a>
        </form>
        <div class="user-auth">
            <a href="login.html">Sign In</a>
            <a href="signup.html">register</a>
        </div>
    </header>

    <div class="content">
        <main>
            <div class="main-title">
                <h1>Ask a Question</h1>
            </div>

            <form class="form">
                <div class="form-row">
                    <label for="title">Title</label>
                    <input id="title" type="text" value="How to build a moon park ?">
                </div>
                <div class="form-row">
                    <label for="text">Text</label>
                    <textarea id="text">Really, how ? Have no idea about it</textarea>
                </div>
                <div class="form-row">
                    <label for="tags">Tags</label>
                    <input id="tags" type="text" value="moon, park, puzzle">
                </div>
                <div>
                    <button class="button" type="button">ASK IT</button>
                </div>
            </form>
        </main>

        <aside class="sidebar">
            <div class="sidebar-section">
                <h2>Trending Tags</h2>
                <div class="tag-cloud">
                    <span>perl</span>
                    <span class="tag-red">python</span>
                    <span>TechnoPark</span>
                    <span class="tag-red">MySQL</span>
                    <span class="tag-green">django</span>
                    <span>Mail.Ru</span>
                    <span>Voloshin</span>
                    <span class="tag-orange">Firefox</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h2>Top Members</h2>
                <div class="member-list">
                    <a href="#">Mr. Freeman</a>
                    <a href="#">Dr. House</a>
                    <a href="#">Bender</a>
                    <a href="#">Queen Victoria</a>
                    <a href="#">V. Pupkin</a>
                </div>
            </div>
        </aside>
    </div>
    <footer class="footer">2026</footer>
</div>
</body>
</html>
