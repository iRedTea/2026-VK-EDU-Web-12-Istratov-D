<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VkDesk | Create Account</title>
    <meta name="description" content="VkDesk Q&A">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">VkDesk</div>
        <form class="search">
            <input type="text" placeholder="Search">
            <a class="button button--ask" href="index.html">ASK IT</a>
        </form>
        <div class="user-auth">
            <a href="login.html">Sign In</a>
            <a href="signup.html">register</a>
        </div>
    </header>
    <div class="content">
        <main>
            <div class="main-title">
                <h1>Create Account</h1>
            </div>

            <p class="error">Sorry, this email address already registered!</p>

            <form class="form">
                <div class="form-row">
                    <label for="login">Login</label>
                    <input id="login" type="text" value="dr_pepper">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" type="email" value="drpepper@mail.ru">
                </div>
                <div class="form-row">
                    <label for="nickname">NickName</label>
                    <input id="nickname" type="text" value="Dr. Pepper">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" type="password" value="********">
                </div>
                <div class="form-row">
                    <label for="repeat">Repeat password</label>
                    <input id="repeat" type="password" value="********">
                </div>
                <div class="form-row">
                    <label>Upload avatar</label>
                    <input type="file">
                </div>
                <div>
                    <button class="button" type="button">Register!</button>
                </div>
            </form>
        </main>
        <aside class="sidebar">
            <div class="sidebar-section">
                <h2>Trending Tags</h2>
                <div class="tag-cloud">
                    <span>perl</span>
                    <span class="tag-red">python</span>
                    <span>TechnoPark</span>
                    <span class="tag-red">MySQL</span>
                    <span class="tag-green">django</span>
                    <span>Mail.Ru</span>
                    <span>Voloshin</span>
                    <span class="tag-orange">Firefox</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h2>Top Members</h2>
                <div class="member-list">
                    <a href="#">Mr. Freeman</a>
                    <a href="#">Dr. House</a>
                    <a href="#">Bender</a>
                    <a href="#">Queen Victoria</a>
                    <a href="#">V. Pupkin</a>
                </div>
            </div>
        </aside>
    </div>
    <footer class="footer">2026</footer>
</body>
</html>
